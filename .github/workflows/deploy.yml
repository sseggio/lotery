# CI/CD: tests -> Docker image on GitHub Container Registry (ghcr.io) -> deployment on the VPS.
#
# Repository settings > Secrets and variables > Actions, environment "production":
#   Secrets:   SSH_PRIVATE_KEY   private key of the deploy user on the VPS
#              SSH_KNOWN_HOSTS   output of `ssh-keyscan -t ed25519 <vps>` (prevents MITM)
#              DEPLOY_HOST       VPS address (IP or host name)
#              DEPLOY_USER       SSH user on the VPS (member of the docker group)
#   Variables: DEPLOY_PATH       folder on the VPS holding .env (e.g. /opt/lotery)
#              DOMAIN            public domain, used for the post-deploy health check
#
# The .env file (passwords, Traefik settings) stays on the VPS and is never stored in GitHub.
# Rollback: Actions > "CI/CD" > Run workflow, with the short SHA of an earlier commit.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy an existing image tag (short commit SHA) instead of building"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lotery

jobs:
  test-backend:
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  test-frontend:
    if: github.event.inputs.image_tag == ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  build:
    needs: [test-backend, test-frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build]
    # Runs after a build on main, or alone for a manual rollback (image_tag given).
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != ''))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DOMAIN || 'example.invalid' }}
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.event.inputs.image_tag || needs.build.outputs.tag }}
      # Accepted either as secrets or as variables (repository or "production" environment).
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
      DOMAIN: ${{ vars.DOMAIN || secrets.DOMAIN }}
      HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
      HAS_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: |
          [[ "$TAG" =~ ^[0-9a-f]{7,40}$ ]] || { echo "Invalid image tag: $TAG"; exit 1; }
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_PATH" ] || missing="$missing DEPLOY_PATH"
          [ -n "$DOMAIN" ] || missing="$missing DOMAIN"
          [ "$HAS_SSH_KEY" = "true" ] || missing="$missing SSH_PRIVATE_KEY"
          [ "$HAS_KNOWN_HOSTS" = "true" ] || missing="$missing SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing (not visible to this job):$missing"
            echo "Create them in Settings > Environments > production (or Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: Deploy
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes $DEPLOY_USER@$DEPLOY_HOST"
          IMG="$IMAGE:$TAG"
          # Ship the compose file (the .env stays on the server).
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes docker-compose.traefik.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.traefik.yml"
          # Short-lived registry login (token through stdin, never on the command line).
          echo "$REGISTRY_TOKEN" | $SSH "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"
          # Record the deployed image in the server's .env (restarts and manual commands use it).
          $SSH "cd '$DEPLOY_PATH' && (grep -q '^LOTERY_IMAGE=' .env && sed -i 's#^LOTERY_IMAGE=.*#LOTERY_IMAGE=$IMG#' .env || echo 'LOTERY_IMAGE=$IMG' >> .env)"
          $SSH "cd '$DEPLOY_PATH' && docker compose -f docker-compose.traefik.yml pull && docker compose -f docker-compose.traefik.yml up -d --no-build --remove-orphans"
          $SSH "docker logout ghcr.io" || true
      - name: Health check
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "https://$DOMAIN/api/health" >/dev/null; then
              echo "Deployed $IMAGE:$TAG"
              ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "docker image prune -af --filter 'until=168h'" >/dev/null || true
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "docker logs lotery --tail 50"
          exit 1
      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
