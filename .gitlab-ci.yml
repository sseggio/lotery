# GitLab CI/CD: tests -> Docker image in the GitLab registry -> deployment on the VPS.
#
# CI/CD variables to create (Settings > CI/CD > Variables, "Protected" + "Masked" when possible):
#   SSH_PRIVATE_KEY   (type File)  private key of the deploy user on the VPS
#   SSH_KNOWN_HOSTS   (type File)  output of `ssh-keyscan -t ed25519 <vps>` (prevents MITM)
#   DEPLOY_HOST                    VPS address (IP or host name)
#   DEPLOY_USER                    SSH user on the VPS (member of the docker group)
#   DEPLOY_PATH                    folder on the VPS holding .env (e.g. /opt/lotery)
#   DOMAIN                         public domain, used for the post-deploy health check
# And a deploy token named exactly "gitlab-deploy-token" with scope read_registry
# (Settings > Repository > Deploy tokens): GitLab then exposes CI_DEPLOY_USER / CI_DEPLOY_PASSWORD.
#
# The .env file (passwords, Traefik settings) stays on the VPS and is never stored in GitLab.

stages: [test, build, deploy]

variables:
  IMAGE_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

# ---- tests ------------------------------------------------------------------
test:backend:
  stage: test
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  script:
    - pip install -r backend/requirements-dev.txt
    - cd backend && python -m pytest -q

test:frontend:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/node_modules]
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm audit --omit=dev --audit-level=high
    - npm run build

# ---- image ------------------------------------------------------------------
build:image:
  stage: build
  image: docker:27.5.1
  services:
    - docker:27.5.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "$IMAGE_LATEST" || true
    - docker build --cache-from "$IMAGE_LATEST" -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE_SHA"
    - docker push "$IMAGE_LATEST"

# ---- deployment ---------------------------------------------------------------
deploy:production:
  stage: deploy
  image: alpine:3.20
  resource_group: production        # never two deployments at the same time
  environment:
    name: production
    url: https://$DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache openssh-client curl
    - install -m 700 -d ~/.ssh
    - install -m 600 "$SSH_PRIVATE_KEY" "$HOME/.ssh/id_deploy"
    - install -m 644 "$SSH_KNOWN_HOSTS" "$HOME/.ssh/known_hosts"
    - export SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes $DEPLOY_USER@$DEPLOY_HOST"
  script:
    # Ship the compose file (the .env stays on the server).
    - scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes docker-compose.traefik.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.traefik.yml"
    # Registry login with the read-only deploy token (password through stdin, not the command line).
    - echo "$CI_DEPLOY_PASSWORD" | $SSH "docker login -u '$CI_DEPLOY_USER' --password-stdin '$CI_REGISTRY'"
    # Record the deployed image in the server's .env (so restarts and manual commands use it).
    - $SSH "cd '$DEPLOY_PATH' && (grep -q '^LOTERY_IMAGE=' .env && sed -i 's#^LOTERY_IMAGE=.*#LOTERY_IMAGE=$IMAGE_SHA#' .env || echo 'LOTERY_IMAGE=$IMAGE_SHA' >> .env)"
    - $SSH "cd '$DEPLOY_PATH' && docker compose -f docker-compose.traefik.yml pull"
    - $SSH "cd '$DEPLOY_PATH' && docker compose -f docker-compose.traefik.yml up -d --no-build --remove-orphans"
    # Wait for the public health check (up to ~2 minutes).
    - |
      for i in $(seq 1 24); do
        if curl -fsS "https://$DOMAIN/api/health" >/dev/null; then
          echo "Deployed $IMAGE_SHA"
          $SSH "docker image prune -af --filter 'until=168h'" >/dev/null || true
          exit 0
        fi
        sleep 5
      done
      echo "Health check failed"; $SSH "docker logs lotery --tail 50"; exit 1
